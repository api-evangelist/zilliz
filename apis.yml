  tags:
  - REST
  - Cluster Management
  - Billing
  - Backups
  description: >-
    The Control Plane API manages clusters (create / modify / suspend), users, roles, backups, alerts,
    metrics, and billing. Authentication is Bearer with a Zilliz API key.
  properties:
