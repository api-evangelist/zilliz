  tags:
  - REST
  - Collection
  - Vectors
  - Search
  tags_raw:
  - REST
  - Collections
  - Vectors
  - Search
  description: >-
    Data Plane endpoints handle collection, vector, partition, index, and role operations on a specific
    cluster. Authentication accepts either a Zilliz API key or a cluster `db_admin:password` pair.
  properties:
  - type: Documentation
    url: https://docs.zilliz.com/reference/restful
